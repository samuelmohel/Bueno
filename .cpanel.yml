---
# cPanel Git Version Control deployment.
#
# Runs on the server when you click "Deploy HEAD Commit" in
# cPanel → Git Version Control.
#
# It publishes the built site, applies database migrations, and refuses to
# proceed if the environment is not ready — a half-deployed site that cannot
# sign sessions is worse than a deploy that stops with a clear message.
#
# One-time setup before the first deploy of this version:
#
#   cd /home/speckles
#   php -r 'echo bin2hex(random_bytes(32)), PHP_EOL;'   # generate APP_SECRET
#   nano .env                                           # see .env.example
#   chmod 600 .env
#
# .env lives at /home/speckles/.env — ABOVE the document root, so it can never
# be served over HTTP even if .htaccess is ignored.

deployment:
  tasks:
    - export DEPLOYPATH=/home/speckles/360.specklessinnovations.com
    - export ENVFILE=/home/speckles/.env

    # ── Locate a PHP the application can actually run on ──────────────────
    #
    # The deploy shell's default `php` is frequently the old system binary,
    # not the version the domain is configured to use in MultiPHP Manager.
    # The application needs 8.1+, so pick the first binary that satisfies
    # that rather than failing later with confusing syntax errors.
    # NOTE: every line below sits at the same indentation on purpose. A YAML
    # folded scalar keeps more-indented lines literal instead of folding them,
    # which would split this loop across newlines and break the shell.
    - >-
      PHPBIN="";
      for c in /opt/cpanel/ea-php84/root/usr/bin/php /opt/cpanel/ea-php83/root/usr/bin/php /opt/cpanel/ea-php82/root/usr/bin/php /opt/cpanel/ea-php81/root/usr/bin/php /usr/local/bin/php /usr/bin/php; do
      if [ -x "$c" ]; then v=$("$c" -r 'echo PHP_MAJOR_VERSION * 100 + PHP_MINOR_VERSION;' 2>/dev/null);
      if [ -n "$v" ] && [ "$v" -ge 801 ]; then PHPBIN="$c"; break; fi; fi; done;
      if [ -z "$PHPBIN" ]; then echo "DEPLOY ABORTED: no PHP 8.1+ binary found on this server.";
      echo "Set the domain to PHP 8.1 or newer in cPanel > MultiPHP Manager."; exit 1; fi;
      export PHPBIN;
      echo "Using PHP: $PHPBIN ($($PHPBIN -r 'echo PHP_VERSION;'))"

    # ── Stop early if the environment is not configured ──────────────────
    - >-
      if [ ! -f "$ENVFILE" ]; then
        echo "DEPLOY ABORTED: $ENVFILE is missing.";
        echo "Create it before deploying — see DEPLOYMENT.md. The API cannot";
        echo "sign sessions without APP_SECRET and would reject every request.";
        exit 1;
      fi

    # ── Publish the built site ───────────────────────────────────────────
    # `out/*` does not match the top-level dotfile, so .htaccess is copied
    # explicitly. Dotfiles inside subdirectories (api/.htaccess and friends)
    # are carried by the recursive copy.
    - /bin/cp -R apps/web/out/* $DEPLOYPATH/
    - /bin/cp -f apps/web/out/.htaccess $DEPLOYPATH/

    # ── Create or update the database schema ─────────────────────────────
    # Idempotent: already-applied migrations are skipped via a ledger table.
    # This is the only thing that creates tables — the previous version built
    # them with DDL inside every HTTP request, which no longer happens.
    - >-
      cd $DEPLOYPATH && $PHPBIN api/_lib/migrate.php up
      || { echo "DEPLOY FAILED: database migration did not complete."; exit 1; }

    - cd $DEPLOYPATH && $PHPBIN api/_lib/migrate.php status

    # ── Confirm the access protections actually landed ───────────────────
    - >-
      for f in api/.htaccess api/_lib/.htaccess api/migrations/.htaccess; do
        [ -f "$DEPLOYPATH/$f" ] || { echo "DEPLOY FAILED: missing $f"; exit 1; };
      done; echo "Access protections in place."

    - echo "Deployment complete."
