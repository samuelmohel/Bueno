worker_processes auto;
events { worker_connections 4096; }

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  upstream api    { server api:3001; }
  upstream web    { server web:3000; }

  # Rate limiting — 30 req/s per IP
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name bueno.ng www.bueno.ng;

    ssl_certificate     /etc/ssl/certs/bueno.crt;
    ssl_certificate_key /etc/ssl/certs/bueno.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # API proxy with rate limiting
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Frontend
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
