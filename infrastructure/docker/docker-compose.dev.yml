# Dev: just postgres + redis. Run API and web with npm run dev.
version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bueno_postgres_dev
    environment:
      POSTGRES_USER: bueno
      POSTGRES_PASSWORD: bueno123
      POSTGRES_DB: bueno_db
    ports: ["5432:5432"]
    volumes: [bueno_pg_dev:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    container_name: bueno_redis_dev
    ports: ["6379:6379"]

volumes:
  bueno_pg_dev:
