version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bueno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bueno
      POSTGRES_PASSWORD: bueno123
      POSTGRES_DB: bueno_db
    ports:
      - "5432:5432"
    volumes:
      - bueno_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bueno -d bueno_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bueno_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - bueno_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: bueno_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://bueno:bueno123@postgres:5432/bueno_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/routes"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: bueno_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
      NEXT_PUBLIC_WS_URL: http://api:3001

volumes:
  bueno_pg:
  bueno_redis:
