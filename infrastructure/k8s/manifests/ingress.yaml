apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bueno-ingress
  namespace: bueno
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [bueno.ng, api.bueno.ng]
      secretName: bueno-tls
  rules:
    - host: api.bueno.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: bueno-api-svc, port: { number: 3001 } }
    - host: bueno.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: bueno-web-svc, port: { number: 3000 } }
