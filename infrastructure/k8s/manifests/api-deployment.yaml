apiVersion: apps/v1
kind: Deployment
metadata:
  name: bueno-api
  namespace: bueno
spec:
  replicas: 2
  selector:
    matchLabels: { app: bueno-api }
  template:
    metadata:
      labels: { app: bueno-api }
    spec:
      containers:
        - name: api
          image: bueno/api:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: bueno-secrets, key: database-url }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: bueno-secrets, key: jwt-secret }
            - name: REDIS_HOST
              value: "bueno-redis-svc"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet: { path: /api/v1/routes, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: bueno-api-svc
  namespace: bueno
spec:
  selector: { app: bueno-api }
  ports:
    - port: 3001
      targetPort: 3001
