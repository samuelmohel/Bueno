apiVersion: apps/v1
kind: Deployment
metadata:
  name: bueno-web
  namespace: bueno
spec:
  replicas: 2
  selector:
    matchLabels: { app: bueno-web }
  template:
    metadata:
      labels: { app: bueno-web }
    spec:
      containers:
        - name: web
          image: bueno/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.bueno.ng/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "https://api.bueno.ng"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: bueno-web-svc
  namespace: bueno
spec:
  selector: { app: bueno-web }
  ports:
    - port: 3000
      targetPort: 3000
